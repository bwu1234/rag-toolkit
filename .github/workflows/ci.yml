name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          python -m pip install --upgrade pip

      - name: Install project (dev extras)
        run: |
          pip install -e .[dev]
          # Install lightweight linters/typecheckers used in CI
          pip install ruff mypy

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          # limit mypy to the package to avoid noisy test-only typing checks; keep --ignore-missing-imports for CI stability
          mypy --ignore-missing-imports rag

      - name: Run tests
        run: |
          pytest -q
