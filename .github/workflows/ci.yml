name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          python -m pip install --upgrade pip

      - name: Install project (dev extras)
        run: |
          pip install -e .[dev]
          # Pin ruff: an unpinned install picks up whatever rules ruff
          # defaults to on release day, which has broken CI before with no
          # code changes on our side. Bump deliberately, not implicitly.
          pip install ruff==0.16.1 mypy

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          # Scoped to rag/ -- the test suite uses structurally-compatible
          # fakes (not subclasses) for its ABCs, which mypy's nominal typing
          # flags but doesn't reflect a real bug. ignore-missing-imports
          # keeps CI stable across envs.
          mypy --ignore-missing-imports rag

      - name: Run tests
        run: |
          pytest -q
