# Inside a container `localhost` is the container itself, so the shared
# config.yaml's http://localhost:11434 can't reach Ollama. Point both clients
# at the `ollama` service instead; load_config() applies RAG__SECTION__KEY
# environment variables on top of the YAML.
#
# The chat model is overridden too: config.yaml's qwen3.5:9b-mlx is built for
# Apple Silicon's MLX stack and won't load in a Linux container. qwen3.5:9b is
# the same model as a GGUF (Q4_K_M) build. It is a different quantization from
# the one docs/measured-results.md was measured with, so answers may differ
# slightly -- don't report eval numbers from this setup as the measured config.
x-ollama-env: &ollama-env
  RAG__LLM__BASE_URL: http://ollama:11434
  RAG__EMBEDDING__BASE_URL: http://ollama:11434
  RAG__LLM__MODEL: qwen3.5:9b

# Shared by every service built from this repo. The repo is bind-mounted over
# /app so code edits and host-built indexes are visible without a rebuild.
# The Hugging Face cache is a named volume so the reranker (a multi-GB
# download) survives container recreation.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./:/app:cached
    - hf-cache:/root/.cache/huggingface
  environment: *ollama-env

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    # No published port: the app containers reach it over the compose
    # network, and publishing 11434 would collide with an Ollama already
    # running on the host.
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pulls the models the effective config names (YAML plus the env
  # above), then exits. A no-op after the first run apart from a manifest check.
  pull-models:
    <<: *app
    command: python scripts/pull_models.py
    depends_on:
      ollama:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn rag.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      pull-models:
        condition: service_completed_successfully

  # The UI builds its own pipeline rather than calling the API, which is why it
  # needs the same Ollama environment.
  ui:
    <<: *app
    command: streamlit run rag/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      pull-models:
        condition: service_completed_successfully

volumes:
  ollama-models:
  hf-cache:

# If you prefer a dedicated Chroma server image, set CHROMA_IMAGE and add
# an additional service entry. By default, the Python client uses local
# persistent mode (no server container) so a separate Chroma container is
# not included here.

# Example usage:
#   docker compose up --build
#   docker compose run --rm api python -m rag.cli index   # if no index exists yet
# Then visit http://localhost:8501 for the Streamlit UI and http://localhost:8000 for the API.
