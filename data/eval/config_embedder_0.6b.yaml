# Chunking plan Phase 1b: the embedder-size comparison. Inherits the shipped
# config and changes only the embedder and where its index lives, since each
# embedder needs its own index (the index manifest refuses a mix).
#
#   python -m rag.cli --config data/eval/config_embedder_0.6b.yaml index --corpus edgar --reset
#
# All three sizes are Q8_0 (`:0.6b` already is; `:4b` and `:8b` default to
# q4_K_M), so the comparison varies size and not quantization.
#
# Pinned to the `fixed` chunker this was measured with, so a rebuild
# reproduces it after config.yaml's default moved to `structured`.
base: ../../rag/config/config.yaml

paths:
  index_dir: data/index_emb-0.6b

embedding:
  model: qwen3-embedding:0.6b

chunking:
  strategy: fixed
