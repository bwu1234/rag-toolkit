[project]
name = "rag"
version = "0.1.0"
description = "Local-first RAG pipeline with swappable components"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Optional so the core install stays lean: `rag.mcp` serves stdio without it
# via a built-in JSON-RPC fallback. Installing it adds the official transports
# (including streamable HTTP at /mcp on the FastAPI app). The floor is 2.0
# because that is where MCP 2026-07-28 -- the only revision this project
# serves -- and the `MCPServer` API arrived.
mcp = [
    "mcp>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Deselect with `-m "not live"`; each live test also skips itself when the
# daemon or its model is missing, so CI (no Ollama) runs none of them.
markers = ["live: talks to a real local Ollama daemon"]

[tool.ruff.lint]
# Pin the rule set explicitly rather than relying on ruff's default selection,
# which has grown across releases and previously broke CI on a ruff bump with
# no code changes on our side. E4/E7/E9/F matches ruff's historical default.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]
