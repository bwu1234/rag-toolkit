[project]
name = "rag"
version = "0.1.0"
description = "Production-style RAG system built from scratch"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Pin the rule set explicitly rather than relying on ruff's default selection,
# which has grown across releases and previously broke CI on a ruff bump with
# no code changes on our side. E4/E7/E9/F matches ruff's historical default.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]
