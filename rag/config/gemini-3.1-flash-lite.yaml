# Generation on Gemini 3.1 Flash-Lite (hosted, free tier) instead of local Ollama.
# Everything else -- index, embedder, retrieval, prompts -- is config.yaml's.
#
#   export GEMINI_API_KEY=...   # from AI Studio; never put it in a file
#   python -m rag.cli --config rag/config/gemini-3.1-flash-lite.yaml chat
#
# The budget is the free tier: 500 requests/day, 15/min, 250k tokens/min
# (AI Studio, 2026-09). One pipeline turn is one request, two with history
# (the condenser); CRAG and query expansion would add more and stay off. The
# client paces under the per-minute limits, and counts requests per Pacific day
# in data/logs/llm_daily_requests.json, refusing at 450 so 50 stay for other
# callers. Still don't point an eval at this without a --limit.
# Evals grade with the local judge below, so they spend Gemini requests on
# generation only.
# Prompts and answers on the free tier may be read by Google.
#
# gemini-3.5-flash-lite.yaml is the same file with the other model, so the
# two can be compared on equal terms.
base: config.yaml

llm:
  provider: gemini
  model: gemini-3.1-flash-lite
  # Must be restated: the inherited Ollama URL would otherwise win over the
  # gemini default, because an inherited value counts as explicitly set.
  base_url: https://generativelanguage.googleapis.com
  api_key_env: GEMINI_API_KEY
  requests_per_minute: 15
  tokens_per_minute: 250000
  requests_per_day: 500
  requests_per_day_reserve: 50
  # Thinking can't be turned off on these models, and its tokens come out of
  # max_tokens (1024, inherited). Minimal is the cheapest level; pinned in both
  # files so a comparison isn't a comparison of model defaults. The client
  # raises, naming the fix, if thinking ever uses the whole budget.
  thinking_level: minimal

eval:
  # The fixed Milestone 19 judge, run locally. Without this, config.yaml's
  # `judge: null` would have Flash-Lite grade its own answers (biased, and a
  # second Gemini call per sample). Its verdicts compare with every
  # gemma4:31b-mlx-judged baseline. Per run, --judge-provider/--judge-model
  # override it.
  judge:
    provider: ollama
    model: gemma4:31b-mlx
    base_url: http://localhost:11434
    temperature: 0.0
    timeout_s: 900

chat:
  # Pinned: config.yaml's agentic default would answer with its local 27b
  # agent (`agent.llm`), not this model. Flash-Lite as the agent is the
  # unmeasured hosted pair (run_answer_matrix.py --family m19-hosted), and
  # each agent turn spends 2-7 requests of the daily budget instead of one.
  mode: pipeline
