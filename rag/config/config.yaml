# Default configuration for the RAG system.
# Every component is selected here — change a `provider` or `model` value to
# swap implementations without touching pipeline code.

paths:
  corpus_dir: data/corpus
  index_dir: data/index

embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  base_url: http://localhost:11434
  dimensions: null

llm:
  provider: ollama
  model: qwen3.5:9b-mlx
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 1024
  think: false

chunking:
  strategy: fixed
  chunk_size: 1000
  chunk_overlap: 150
  # Contextual retrieval: at index time, ask the LLM to write a sentence
  # situating each chunk in its parent document, and index that sentence
  # prepended to the chunk. Fixes chunks that never name their own subject
  # ("the limit is 1,000/min" with no mention of which API), which no amount
  # of query-time tuning can reach.
  #
  # Costs one LLM call PER CHUNK during `python -m rag.cli index` -- by far the
  # most expensive thing here, but paid per index rather than per query.
  # `chunk.text` is never modified, so citations still quote the source
  # verbatim. Re-index with `--reset` after changing any of these.
  contextual:
    enabled: false
    max_document_chars: 8000
    max_context_chars: 400

vector_store:
  provider: chroma
  collection_name: rag_corpus

reranker:
  provider: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # How to fold per-query scores together when retrieval.expansion is on:
  #   max  — keep a chunk any phrasing found relevant (lets expansion affect ranking)
  #   mean — require agreement across phrasings (suppresses one-off rewrites)
  aggregate: max

retrieval:
  # hybrid = dense vector search + BM25 keyword search, fused with RRF
  mode: hybrid
  top_k: 20
  rerank_top_k: 5
  rrf_k: 60
  # Relevance floor on the final results. Scale depends on the active
  # reranker -- retune when changing reranker.provider. 0.0 disables it.
  min_score: 0.1
  # Pre-retrieval query transformation. Each adds an LLM call to every search:
  #   none        — search the query as typed (no LLM in the retrieval path)
  #   hyde        — embed a generated hypothetical answer passage instead
  #   multi_query — retrieve for several rephrasings and fuse with RRF
  # Measure with `python -m rag.eval.retrieval_eval` before leaving one on.
  expansion:
    provider: none
    num_queries: 3
    num_documents: 1
    include_original: true
  # Live web search, fused in as a third ranked list alongside dense/BM25.
  # Disabled by default -- needs a reachable SearxNG instance, and every
  # enabled query leaves the local machine.
  web_search:
    enabled: false
    searxng_url: http://localhost:8080
    top_k: 10
    min_similarity: 0.5
    dedup_threshold: 0.75
    timeout_s: 10.0

chat:
  # Rewrite follow-up questions into standalone ones (using recent turns)
  # before retrieval. Costs one extra LLM call per turn that has history.
  condense_history: true
  max_history_turns: 6

# Corrective RAG -- let the pipeline reject its own intermediate results.
# `retrieval.min_score` filters on a similarity score; these filter on
# judgments about whether a passage answers the question and whether the
# answer is supported by its passages.
#
# Off by default because the cost is steep on the query path: `grade_documents`
# alone is one LLM call per retrieved passage (retrieval.rerank_top_k of them),
# on top of generation. Every check fails open, so a broken one degrades to
# plain RAG rather than failing the turn. Measure with
# `python -m rag.eval.answer_eval` before leaving it on.
crag:
  enabled: false
  # Drop retrieved passages the LLM judges irrelevant to the question.
  grade_documents: true
  # Extra retrieve attempts with a reworded query when grading leaves nothing.
  max_retries: 1
  # Read the generated answer back against its passages; regenerate if unsupported.
  check_groundedness: true
  max_regenerations: 1
