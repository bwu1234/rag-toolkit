# Default configuration for the RAG system.
# Every component is selected here — change a `provider` or `model` value to
# swap implementations without touching pipeline code.

paths:
  # corpus_dir is the fallback used only when `corpora.registry` below is empty
  # (a config predating the registry) -- it resolves to the same on-disk
  # location as the `baseline` entry below.
  corpus_dir: data/corpora/baseline/documents
  index_dir: data/index

# Named corpora. `active` selects which the CLI and eval runners operate on;
# override per-invocation with `--corpus NAME` (repeatable).
#
# Listing SEVERAL names pools them into one index, which is the point of the
# registry: the same corpora indexed alone vs. pooled measure different things.
# Isolated tells you retrieval quality within a corpus; pooled tells you how
# much a corpus of plausible-but-wrong neighbours costs you. The gap between
# them is the interference cost, and it cannot be seen with one corpus.
#
# Collection and BM25 index names are derived from the selection
# (`rag_corpus__edgar`, `rag_corpus__baseline+edgar`), so isolated and pooled
# indexes coexist instead of silently overwriting each other -- comparing them
# is the whole exercise.
corpora:
  active: [baseline]
  registry:
    baseline:
      documents_dir: data/corpora/baseline/documents
      description: >
        Small hand-written sample corpus (8 docs, ~26k chars). Too small to
        evaluate against on its own -- top_k 20 retrieves ~65% of it, so
        retrieval metrics saturate. Keep it as a control, not a measurement.
    edgar:
      documents_dir: data/corpora/edgar/documents
      description: >
        SEC 10-K/10-Q MD&A sections (61 filings, ~3.6M chars) as plain text.
        Built by scripts/fetch_edgar.py; documents are gitignored and
        reproduced from data/corpora/edgar/manifest.json. Results up to
        Milestone 19 phase 4 were measured on it; new EDGAR measurements use
        edgar_md, and edgar is the source edgar_md is rendered from.
    edgar_md:
      documents_dir: data/corpora/edgar_md/documents
      description: >
        The same 61 filings and text as `edgar`, re-rendered as Markdown:
        section headings, tables with a header row, no page furniture
        (chunking plan Phase 4). Same document ids, so every EDGAR eval set
        runs against it; don't pool it with `edgar`. Built offline by
        `scripts/fetch_edgar.py --cache-raw` then `--render-markdown`.
    # Public benchmarks (docs/public-benchmarks-plan.md): pre-split passages
    # with published relevance labels. `clean: false` indexes the text exactly
    # as published; pair them with rag/config/beir.yaml, which keeps each
    # passage whole. Fetch with scripts/fetch_beir.py <name>; only ever
    # evaluated isolated, never pooled.
    beir-fiqa:
      documents_dir: data/corpora/beir-fiqa/documents
      clean: false
      description: >
        BEIR FiQA-2018: 57,638 financial Q&A passages, 648 test queries.
        Pinned in data/corpora/beir-fiqa/manifest.json.
    beir-scifact:
      documents_dir: data/corpora/beir-scifact/documents
      clean: false
      description: >
        BEIR SciFact: 5,183 scientific abstracts, 300 test claims; no dev
        split, so a transfer check only. Pinned in its manifest.
    beir-nfcorpus:
      documents_dir: data/corpora/beir-nfcorpus/documents
      clean: false
      description: >
        BEIR NFCorpus: 3,633 medical abstracts, 323 test queries with graded
        labels (~38 relevant each). Pinned in its manifest.
    musique-ans-dev:
      documents_dir: data/corpora/musique-ans-dev/documents
      clean: false
      description: >
        MuSiQue-Ans dev: 21,100 Wikipedia paragraphs pooled over 2,417 2-4 hop
        questions; the confirmatory multi-hop set. Pinned in
        data/corpora/musique-ans/manifest.json; index with
        rag/config/musique.yaml.
    musique-ans-train-tune:
      documents_dir: data/corpora/musique-ans-train-tune/documents
      clean: false
      description: >
        MuSiQue-Ans train slice for tuning: 25,777 paragraphs pooled over
        2,417 questions sharing none with dev, 300 of them scored.

embedding:
  # `ollama` (a local daemon) or `sentence_transformers` (the model runs in
  # this process: a Hugging Face download, torch memory, MPS/CPU). The latter
  # exists for the BEIR reference encoder (rag/config/beir_bge.yaml) and is
  # unmeasured on EDGAR. For it, `revision` pins the weights to a commit
  # (null = latest; part of the index manifest), and `query_instruction` is
  # sent as a plain `{instruction} {query}` prefix.
  provider: ollama
  # 0.6b on evidence: the 4b and 8b sizes (Q8_0) measured no better than noise
  # at this pipeline's settings -- BM25 already finds what they add in dense-only
  # retrieval (docs/measured-results.md, "Embedder size"). Changing it needs
  # `index --reset`.
  model: qwen3-embedding:0.6b
  base_url: http://localhost:11434
  dimensions: null
  # Query-side instruction (Qwen3-Embedding's `Instruct: ...\nQuery:` prefix).
  # null on evidence: the model card's retrieval task measured no better than
  # noise on EDGAR, and leaned worse (docs/measured-results.md, "Query
  # instruction for the embedder"). On BEIR the same instruction gained +0.077
  # nDCG@10 on FiQA and +0.057 on NFCorpus, dense only ("BEIR query-time
  # stack"). So re-measure on EDGAR with a filings-specific task before
  # turning it on; BEIR alone doesn't. Query-time only, so no reindex to change it.
  query_instruction: null

llm:
  provider: ollama
  model: qwen3.5:9b-mlx
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 1024
  think: false

chunking:
  # fixed = 1,000-char windows with overlap. structured = split on Markdown
  # headings, table edges and paragraph breaks, packing up to chunk_size;
  # oversized tables split by rows with the header rows repeated, so no chunk
  # starts mid-table (settings under `structured` below). none = one chunk per
  # document, for pre-split corpora (rag/config/beir.yaml).
  #
  # structured is the default since chunking plan Phase 5: on edgar_md it
  # raised table-tier answer pass from 0.811 to 0.947 and tied on the
  # answerable set (docs/measured-results.md). Changing it re-chunks every
  # document; `rag.cli index` re-embeds the changed chunks and purges the rest.
  strategy: structured
  chunk_size: 1000
  chunk_overlap: 150
  # Used only by `strategy: structured` (docs/chunking-indexing-plan.md,
  # Phase 5). Headings with split_level or fewer `#` always start a chunk; a
  # section under min_chars joins its next sibling; prose_overlap applies
  # chunk_overlap between paragraphs of one section too (oversized paragraphs
  # always get it).
  structured:
    split_level: 2
    min_chars: 200
    prose_overlap: false
  # Contextual retrieval: at index time, ask the LLM to write a sentence
  # situating each chunk in its parent document, and index that sentence
  # prepended to the chunk. Fixes chunks that never name their own subject
  # ("the limit is 1,000/min" with no mention of which API), which no amount
  # of query-time tuning can reach.
  #
  # Costs one LLM call PER CHUNK during `python -m rag.cli index` -- by far the
  # most expensive thing here, but paid per index rather than per query.
  # `chunk.text` is never modified, so citations still quote the source
  # verbatim. Re-index with `--reset` after changing any of these (`index`
  # refuses to run until you do).
  contextual:
    enabled: false
    max_document_chars: 8000
    max_context_chars: 400
    # Per-chunk calls are independent, so these run concurrently. Raising this
    # past the serving backend's parallelism (Ollama's OLLAMA_NUM_PARALLEL)
    # queues requests rather than speeding them up.
    concurrency: 4
    # Checkpoint generated contexts to data/index/contextual_cache.jsonl so an
    # interrupted run resumes instead of restarting. The key covers every input
    # to the call, so changing a prompt or limit misses the cache rather than
    # reusing a stale blurb -- which is why it survives `index --reset`. Use
    # `index --clear-context-cache` to force regeneration.
    cache: true
  # Document metadata copied onto every chunk, where both indexes store it.
  # Keys a document lacks are skipped; dates are stored as YYYYMMDD integers.
  # EDGAR files carry company, ticker, form, period_end, filed and accession in
  # their YAML front matter (files fetched before the fetcher wrote it need
  # `scripts/fetch_edgar.py --backfill-front-matter`). Changing this needs
  # `index --reset`.
  carry_metadata: [title, page, page_count, company, ticker, form, period_end, filed, accession]
  # A deterministic line naming each chunk's document, indexed (embedded and
  # BM25) ahead of the chunk and shown to the answering model as the passage's
  # source. A document missing any named field gets no header (`index-report`
  # shows how many have one). Changing it needs `index --reset`.
  #
  # On by evidence: on EDGAR it raised answer pass +7.5pp on the generated set
  # and +14.4pp on underspecified questions, at no query-time cost and no LLM
  # calls; it replaces contextual chunking as the way to put document identity
  # into chunks (docs/measured-results.md, "Deterministic chunk header").
  header:
    template: "{company} ({ticker}) {form}, period ended {period_end}"

vector_store:
  provider: chroma
  collection_name: rag_corpus
  # HNSW search beam per query (Chroma's `ef_search`; raised to `top_k` if
  # lower). Dense search is approximate: at Chroma's default of 100 it missed
  # a dense candidate on 3 of 347 EDGAR questions, and returned only 88.6% of
  # the exact top 100 on BEIR FiQA. 400 makes EDGAR's dense top 20 exact for
  # about 1 ms a query; the eval results were identical, sample for sample
  # (docs/measured-results.md, "HNSW `ef_search`"). The margin is for larger
  # or pooled corpora. Query time only; no reindex. Chroma reads it when a
  # process first opens the collection, so one process can't use two values --
  # the store refuses rather than silently ignoring the second.
  hnsw_ef_search: 400

# Keyword index kept beside the vector store (used by retrieval.mode: hybrid).
# bm25 = rank_bm25 + one JSON file; rebuilds on every change, fine to ~10^4
# chunks. sqlite_fts5 = SQLite FTS5, updated in place, for larger corpora;
# needs SQLite >= 3.43 (on Linux, the OS's: Debian 13 / Ubuntu 24.04 or newer).
# Its BM25 parameters differ slightly (k1 1.2 vs 1.5, IDF floor); on EDGAR
# the full pipeline measured no difference (1W/3L of 347, p=0.63), so bm25
# stays the default at this size (docs/measured-results.md, "SQLite FTS5
# sparse backend"). Each has its own file, so switching needs no --reset;
# the next `index` run fills the new one.
sparse_index:
  provider: bm25

reranker:
  provider: cross_encoder
  # Changed from cross-encoder/ms-marco-MiniLM-L-6-v2 on measured evidence:
  # +10.4pp hit rate (0.770 -> 0.874) and +0.138 NDCG on the EDGAR set, at a cost
  # of ~1.1s/query instead of ~0.25s. See docs/measured-results.md.
  #
  # MiniLM was the binding constraint on the whole pipeline: stage-1 retrieval
  # surfaces the right chunk 97.7% of the time, and MiniLM converted that into
  # 77%. It also got *worse* when given more candidates, while this model gets
  # better -- so `retrieval.top_k` is worth revisiting now that reranking can
  # actually use a larger pool.
  model: BAAI/bge-reranker-v2-m3
  # How to fold per-query scores together when retrieval.expansion is on:
  #   max  — keep a chunk any phrasing found relevant (lets expansion affect ranking)
  #   mean — require agreement across phrasings (suppresses one-off rewrites)
  aggregate: max
  # Score each passage with its chunk header in front (see chunking.header), so
  # the cross-encoder sees the company and period. No effect without headers.
  # On by evidence: two periods' copies of a paragraph have identical text, and
  # only the header tells them apart. It took period-tier answers 0.800 -> 0.927
  # over the header alone, and was noise elsewhere (docs/measured-results.md).
  include_header: true

retrieval:
  # hybrid = dense vector search + BM25 keyword search, fused with RRF
  mode: hybrid
  top_k: 20
  rerank_top_k: 5
  rrf_k: 60
  # Relevance floor on the final results. Scale depends on the active reranker
  # AND its model -- retune when changing either. 0.0 disables it.
  #
  # Set to 0.0 deliberately, not lazily. Measured on the EDGAR set, 0.0 / 0.1 /
  # 0.3 gave byte-identical results under the old MiniLM reranker: the floor was
  # inert, tuned by hand against the retired 31-chunk corpus. Carrying 0.1 over
  # to a different model would have been worse than inert -- score distributions
  # differ enough between rerankers that an inherited threshold can silently
  # reject everything. Re-derive it from this model's actual score distribution
  # before turning it back on.
  min_score: 0.0
  # Pre-retrieval query transformation. Each adds an LLM call to every search:
  #   none        — search the query as typed (no LLM in the retrieval path)
  #   hyde        — embed a generated hypothetical answer passage instead
  #   multi_query — retrieve for several rephrasings and fuse with RRF
  # Measure with `python -m rag.eval.retrieval_eval` before leaving one on.
  expansion:
    provider: none
    num_queries: 3
    num_documents: 1
    include_original: true
  # Live web search, fused in as a third ranked list alongside dense/BM25.
  # Disabled by default -- needs a reachable SearxNG instance, and every
  # enabled query leaves the local machine.
  web_search:
    enabled: false
    searxng_url: http://localhost:8080
    top_k: 10
    min_similarity: 0.5
    dedup_threshold: 0.75
    timeout_s: 10.0
  # Document-level routing: rank one record per document (BM25 + dense) and,
  # when both put the same document first, filter chunk retrieval to the
  # `top_m` best. When they disagree, retrieval runs unfiltered. Needs no
  # caller input, unlike `filters` on POST /chat. An explicit filter wins.
  # null = off. Query-time only, so no reindex to change it.
  #
  # Off by evidence, for now: top_m 1 took period-tier hit 0.836 -> 0.927 and
  # underspecified 0.822 -> 0.856 with one wrong route in 162, but McNemar's p
  # (0.062, 0.12) doesn't clear noise and the gate was chosen on the same
  # questions. top_m 2 is dominated. Use 1 if turning it on
  # (docs/measured-results.md, "Document routing").
  # `record_template` fills from the chunk header and carried metadata; `:date`
  # spells a date the way questions write it ("February 15, 2026").
  document_routing:
    top_m: null
    record_template: "{header}; period ended {period_end:date}"

chat:
  # pipeline -- retrieve once, then generate (what every result in
  #             docs/measured-results.md before Milestone 19 used; ~8-10 s/turn)
  # agentic  -- the model calls search as a tool, as often as it needs, under
  #             the guards in `agent:` below. Skips the condenser and CRAG's
  #             grader/retries; see docs/milestone-19-plan.md. The default
  #             since ADR 0015: it completes ~2x the bridge/discovery questions
  #             at ~35 s single-hop, 60-90 s multi-hop, up to ~2 min refusals
  mode: agentic
  # Rewrite follow-up questions into standalone ones (using recent turns)
  # before retrieval. Costs one extra LLM call per turn that has history.
  condense_history: true
  max_history_turns: 6
  # How the generation prompt is phrased:
  #   grounded -- numbered passages, inline [n] citations, "say so if the
  #               passages don't answer" (the served pipeline)
  #   plain    -- bare "context + question", no citations, no refusal
  #               instruction; a baseline for measuring what grounding buys
  #               (used by vanilla.yaml)
  prompt: grounded

# Corrective RAG -- let the pipeline reject its own intermediate results.
# `retrieval.min_score` filters on a similarity score; these filter on
# judgments about whether a passage answers the question and whether the
# answer is supported by its passages.
#
# Off by default because the cost is steep on the query path: `grade_documents`
# alone is one LLM call per retrieved passage (retrieval.rerank_top_k of them),
# on top of generation. Every check fails open, so a broken one degrades to
# plain RAG rather than failing the turn. Measure with
# `python -m rag.eval.answer_eval` before leaving it on.
crag:
  enabled: false
  # Drop retrieved passages the LLM judges irrelevant to the question.
  grade_documents: true
  # Extra retrieve attempts with a reworded query when grading leaves nothing.
  max_retries: 1
  # Read the generated answer back against its passages; regenerate if unsupported.
  check_groundedness: true
  max_regenerations: 1

# Milestone 19 -- agentic retrieval: the model calls search as a tool, as many
# times as it needs, instead of the pipeline's single retrieve-then-generate.
# Read only when `chat.mode: agentic` (rag/generation/agent.py), the default
# since ADR 0015 (docs/decisions/). Measured on edgar_md (docs/measured-results.md,
# "Agentic retrieval on edgar_md"): with the 27b below, the loop completes
# ~32/35 multi-hop and ~13/15 bridge/discovery questions against the
# pipeline's ~25 and ~7, at 1-2 min per hard question. The 9b doesn't search a
# second time and gains nothing, so the agent's model is not `llm`. Every
# guard below answers a failure the prototype showed.
agent:
  # The agent's own model; null uses `llm` -- which would make the default
  # the 9b agent, measured no better than the pipeline. Must be a provider
  # that can call tools (ollama or gemini). This is exactly the measured
  # `agentic react / 27b, think=low` row's model (a test holds them equal);
  # think: low matched default thinking's quality with fewer tokens. The 9b
  # in `llm` keeps the utility calls.
  llm:
    provider: ollama
    model: qwen3.8:27b-mlx
    base_url: http://localhost:11434
    max_tokens: 4096
    timeout_s: 600
    think: low
  # react   -- the model decides after each result whether to search again
  # planned -- one call plans all sub-queries, they run back to back, then one
  #            call answers (for a model that decomposes but won't iterate)
  strategy: react
  # Searches per turn; at the cap the model gets one tool-free turn to answer.
  max_tool_calls: 8
  # Wall-clock budget for an agent turn's searching: checked before each call,
  # then one tool-free call answers. Sized for batch measurement; now that the
  # agent serves the UI, whether it should get ~60 s instead is still open
  # (and unmeasured -- a lower cap cuts off the searches that win).
  timeout_s: 600
  # Per-passage character cap in search results (matches the MCP server).
  max_passage_chars: 1200
  # Context window requested on every agent call. Ollama drops the overflow of
  # a longer prompt silently; the adapter warns at 90% of this.
  num_ctx: 32768
  # Let the model pass rag_search a metadata filter (ticker, form, period_end,
  # ...) so other companies' and quarters' look-alike passages can't crowd the
  # right one out of the top results. It narrows a /chat filter, never widens
  # it. Off until measured: the `+ filters` rows of `run_answer_matrix.py
  # --family m19`, and the injection tier (docs/milestone-19-plan.md, phase 5).
  model_filters: false
  # Tools offered to the model; rag_search is required. rag_list_documents lists
  # the corpus's documents and their metadata (companies, forms, periods), for
  # questions about a set ("which airlines...") that no ranked search can
  # enumerate. Each call of either counts toward max_tool_calls. calculator
  # evaluates arithmetic (a percentage change, a margin) over figures from the
  # passages instead of the model doing it in its head; it isn't counted
  # against max_tool_calls. Not yet measured: the `+ list` and `+ calc` rows of
  # `run_answer_matrix.py --family m19`.
  tools: [rag_search]

# Milestone 12 -- persist every chat turn (queries, retrieved/kept/cited chunk
# ids, CRAG verdicts, per-stage latency, LLM calls and tokens, the answer) and
# the thumbs up/down given to it. Written by the API, the UI and `cli chat`;
# never by the eval runners. Inspect with `python -m rag.cli turns`.
#   jsonl -- append to a local file (gitignored under data/logs/)
#   none  -- record nothing; the API's /feedback then answers 503
observability:
  turn_log:
    provider: jsonl
    path: data/logs/turns.jsonl

# Settings read only by the eval runners.
eval:
  # The LLM-as-judge for answer_eval, multihop_eval and run_answer_matrix.py.
  # null judges with `llm` -- the generator grading itself. That reproduces
  # every result recorded before Milestone 19, but it makes a generator
  # comparison meaningless (swap the generator and the judge swaps too), so the
  # runners warn while it's null. Override per run with --judge-model, and add
  # --judge-provider when the judge's provider differs from the one it
  # inherits (a local judge for a Gemini generator). The fixed judge the
  # Milestone 19 baselines use:
  #
  #   judge:
  #     provider: ollama
  #     model: gemma4:31b-mlx
  #     base_url: http://localhost:11434
  #     temperature: 0.0
  #     timeout_s: 900
  #
  # The same model hosted on the Gemini API, which frees the local GPU:
  #
  #   judge:
  #     provider: gemini
  #     model: gemma-4-31b-it
  #     temperature: 0.0
  #     api_key_env: GEMINI_API_KEY   # read from the environment, never put here
  #     requests_per_minute: 30       # free-tier limits from AI Studio
  #     tokens_per_minute: 16000
  #
  # Tokens/min is the binding limit: a judge prompt is ~2-3k tokens, so expect
  # ~5-7 calls a minute and ~25 min for the phase-0 set. It's not the same
  # build as the MLX one, so its verdicts are filed separately
  # (`__judge-gemma-4-31b-it`) and are not comparable with the local judge's
  # until an agreement run shows they are. Free-tier prompts may be read by
  # Google; fine for public filings, not for a private corpus.
  judge: null
