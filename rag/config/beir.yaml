# Public benchmark runs (docs/public-benchmarks-plan.md): BEIR passages scored
# against their published relevance labels.
#
#   python scripts/fetch_beir.py scifact
#   python -m rag.cli --config rag/config/beir.yaml index --corpus beir-scifact
#   python -m rag.cli --config rag/config/beir.yaml index-report --corpus beir-scifact
#
# Inherits vanilla.yaml (dense only, no reranker, no chunk header) and changes
# only what the benchmark representation needs. The corpora's own registry
# entries set `clean: false`, so their text is indexed as published whichever
# config indexes them. Phase 4 variants (hybrid, reranker) should inherit this
# file so every variant sees the same passages.
base: vanilla.yaml

paths:
  # Its own index, so benchmark collections never share a directory with the
  # EDGAR ones.
  index_dir: data/index_beir

chunking:
  # One chunk per passage, text unchanged. The default 1,000-char chunker would
  # split long passages and let one document fill several of the top 10 ranks,
  # which BEIR scoring does not allow.
  strategy: none
  # The title is already in the text (rag.ingestion.loaders.beir_passage_text);
  # carrying it too keeps it visible in results.
  carry_metadata: [title]
  header:
    template: null
  contextual:
    enabled: false

retrieval:
  # Explicit depths: R@100 needs at least 100 results per query, and with no
  # reranker `rerank_top_k` is the final truncation, so both are 100. nDCG@10
  # reads the first 10. Far too many to hand an answering model -- this config
  # is for retrieval scoring, not chat.
  top_k: 100
  rerank_top_k: 100

reranker:
  # Read only by the reranked phase-4 variants (this file's own reranker is
  # `none`). 512 tokens per (query, passage) pair: about twice the longest
  # shipped chunk (1,000 chars plus its header), so the reranker is used as the
  # shipped pipeline uses it. At the model's 8,192 limit, FiQA's long tail (up
  # to 17k chars) exhausted memory on dev. Chosen on dev, before any test run
  # (docs/beir-phase4-protocol.md).
  max_length: 512

vector_store:
  # Near-exact dense search, so a benchmark row measures the retriever and not
  # HNSW's approximation. Chosen by recall against exact search, with no
  # relevance labels read: >= 0.998 of the exact top 100 on all three sets
  # (Chroma's default of 100 returned 0.886 on FiQA). About 10 ms a query on
  # FiQA. docs/measured-results.md, "HNSW `ef_search`".
  hnsw_ef_search: 1600
